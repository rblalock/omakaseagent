name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dist bundles
        run: npm run build

      - name: Verify native agents
        run: npm run verify:native-agents

      - name: Verify omakase learn
        run: npm run verify:learn